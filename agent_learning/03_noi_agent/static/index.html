<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOI 竞赛教练 Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>NOI 竞赛教练 Agent</h1>
        
        <!-- 登录区 -->
        <div id="login-section" class="section">
            <h2>登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>用户 ID:</label>
                    <input type="text" id="user-id" placeholder="teacher 或 student_a" required>
                </div>
                <div class="form-group">
                    <label>密码:</label>
                    <input type="password" id="password" placeholder="password" required>
                </div>
                <button type="submit">登录</button>
            </form>
            <div id="login-error" class="error"></div>
        </div>

        <!-- 已登录状态栏 -->
        <div id="user-bar" class="user-bar hidden">
            <span>当前用户: <strong id="current-user"></strong></span>
            <span>角色: <strong id="current-role"></strong></span>
            <button id="logout-btn">退出</button>
        </div>

        <!-- 学生区 -->
        <div id="student-section" class="section hidden">
            <h2>学生练习区</h2>
            
            <div class="form-group">
                <label>题目编号:</label>
                <input type="text" id="student-problem-id" placeholder="例如: P1001" value="P1001">
                <button id="check-quota-btn">查询配额</button>
            </div>
            
            <div id="quota-info" class="quota-info"></div>
            
            <div class="chat-container">
                <h3>对话记录</h3>
                <div id="chat-history" class="chat-history"></div>
                
                <div class="chat-input">
                    <textarea id="student-message" placeholder="输入你的问题..." rows="3"></textarea>
                    <button id="send-btn">发送</button>
                </div>
            </div>
            
            <button id="clear-history-btn" class="secondary">清空对话</button>
        </div>

        <!-- 教师区 -->
        <div id="teacher-section" class="section hidden">
            <h2>教师管理区</h2>
            
            <div class="teacher-tools">
                <h3>查询学生配额</h3>
                <div class="form-row">
                    <input type="text" id="query-student-id" placeholder="学生 ID">
                    <input type="text" id="query-problem-id" placeholder="题目 ID" value="P1001">
                    <button id="teacher-check-quota-btn">查询</button>
                </div>
                <div id="teacher-quota-result" class="quota-info"></div>
            </div>
            
            <div class="teacher-tools">
                <h3>重置学生配额</h3>
                <div class="form-row">
                    <input type="text" id="reset-student-id" placeholder="学生 ID">
                    <input type="text" id="reset-problem-id" placeholder="题目 ID" value="P1001">
                    <button id="reset-quota-btn" class="warning">重置配额</button>
                </div>
                <div id="reset-result" class="result"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
