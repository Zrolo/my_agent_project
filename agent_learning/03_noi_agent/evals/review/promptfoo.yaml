# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: NOI review baseline vs mode-route eval

prompts:
  - id: review-case
    raw: "{{case}}"

providers:
  - id: exec:/bin/zsh -lc 'cd "$(git rev-parse --show-toplevel)/agent_learning/03_noi_agent" && REVIEW_EVAL_FORCE_MODE=independent_reflect python3 evals/review/run_review_case.py'
    label: baseline_current
  - id: exec:/bin/zsh -lc 'cd "$(git rev-parse --show-toplevel)/agent_learning/03_noi_agent" && python3 evals/review/run_review_case.py'
    label: mode_route

tests: file://evals/review/promptfoo_tests.jsonl
