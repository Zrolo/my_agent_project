# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: NOI review baseline vs mode-route eval via kimi-cli (sample)

prompts:
  - id: review-case
    raw: "{{case}}"

providers:
  - id: exec:/bin/zsh -lc 'cd "$(git rev-parse --show-toplevel)/agent_learning/03_noi_agent" && REVIEW_EVAL_FORCE_MODE=independent_reflect python3 evals/review/run_review_case_kimi_cli.py'
    label: baseline_current_kimi_cli
  - id: exec:/bin/zsh -lc 'cd "$(git rev-parse --show-toplevel)/agent_learning/03_noi_agent" && python3 evals/review/run_review_case_kimi_cli.py'
    label: mode_route_kimi_cli

tests: file://evals/review/promptfoo_tests.sample.jsonl
